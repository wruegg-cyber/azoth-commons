name: Report a problem
description: A broken link, a video that won't play, a mistake in the docs, or a bug in a published tool.
title: "[Problem] "
labels: ["problem"]
body:
  - type: textarea
    id: what
    attributes:
      label: What went wrong?
      description: What you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where?
      description: A link to the page, file or tool.
